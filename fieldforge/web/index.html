<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge Estimate | FieldForge</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800;900&family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <link rel="stylesheet" href="/web/css/theme.css" />
    <link rel="stylesheet" href="/web/css/workspace.css" />
  </head>
  <body>
    <div class="app">
      <!-- Top bar: job title only -->
      <header class="topbar">
        <h1>Forge Estimate: AC Unit Repair — 123 Maple St</h1>
      </header>

      <!-- Capture input -->
      <div style="padding: 16px 32px; display: flex; gap: 12px; align-items: center">
        <input
          id="transcript"
          style="flex: 1; padding: 10px; border: 1px solid var(--outline); border-radius: 8px"
          value="replaced the capacitor and contactor, one hour labor"
        />
        <button id="forge-btn" class="btn btn--primary">
          <span class="material-symbols-outlined">bolt</span> Forge estimate
        </button>
      </div>

      <div class="panes">
        <!-- Left: AI Forge log -->
        <section class="pane pane--log">
          <div class="pane-head">
            <div class="forge-status">
              <span class="material-symbols-outlined">terminal</span>
              <h2>AI Forge: <span id="forge-state">Idle</span></h2>
            </div>
            <span class="live-dot"></span>
          </div>
          <div class="pane-body log" id="log">
            <p class="log-empty">Waiting for capture…</p>
          </div>
        </section>

        <!-- Right: Draft Estimate -->
        <section class="pane pane--estimate">
          <div class="pane-head">
            <h2>Draft Estimate</h2>
            <div class="est-actions">
              <button class="btn">
                <span class="material-symbols-outlined">add</span> Add Item
              </button>
              <button class="btn" id="pdf-btn">
                <span class="material-symbols-outlined">picture_as_pdf</span> Preview PDF
              </button>
            </div>
          </div>
          <div class="pane-body">
            <table>
              <thead>
                <tr>
                  <th>Description</th>
                  <th>Qty</th>
                  <th class="num">Rate</th>
                  <th class="num">Amount</th>
                </tr>
              </thead>
              <tbody id="est-rows"></tbody>
            </table>

            <div class="summary">
              <div class="rows">
                <div class="row"><span>Subtotal</span><span id="sum-subtotal">$0.00</span></div>
                <div class="row">
                  <span>Tax (<span id="sum-tax-rate">0%</span>)</span
                  ><span id="sum-tax">$0.00</span>
                </div>
                <div class="row row--total">
                  <span>Total</span><span id="sum-total">$0.00</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Footer action bar -->
      <footer class="footer">
        <select id="lang">
          <option>English</option>
          <option>Spanish (Español)</option>
          <option>French (Français)</option>
        </select>
        <div class="right">
          <button class="link-btn">Discard Draft</button>
          <button class="btn btn--primary">
            Finalize &amp; Send <span class="material-symbols-outlined">send</span>
          </button>
        </div>
      </footer>
    </div>

    <script type="module" src="/web/js/workspace.js"></script>
  </body>
</html>
